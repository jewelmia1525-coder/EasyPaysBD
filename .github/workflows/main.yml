name: Build EasyPayBD Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create temporary release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/easypaybd-release.jks" \
            -storepass "easypaybd-temp-password" \
            -keypass "easypaybd-temp-password" \
            -alias "easypaybd" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=EasyPayBD, OU=EasyPayBD, O=EasyPayBD, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easypaybd-release.jks
          ANDROID_KEYSTORE_PASSWORD: easypaybd-temp-password
          ANDROID_KEY_ALIAS: easypaybd
          ANDROID_KEY_PASSWORD: easypaybd-temp-password
        run: gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyPayBD-Release-APK
          path: app/build/outputs/apk/release/*.apk
